name: release

on:
  push:
    tags:
      - "v*.*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p ask-ark -p webhook
      - name: Verify static binaries
        run: |
          set -euo pipefail
          for bin in ark m365-webhook; do
            desc=$(file -b "target/$TARGET/release/$bin")
            echo "$bin: $desc"
            case "$desc" in
              *"dynamically linked"*)
                echo "::error::$bin is dynamically linked"; exit 1 ;;
            esac
          done
      - name: Package
        run: |
          set -euo pipefail
          dir="ask-ark-${GITHUB_REF_NAME}"
          asset="ask-ark-${{ matrix.arch }}-linux-musl.tar.gz"
          mkdir -p "dist/$dir/realtime"
          cp "target/$TARGET/release/ark" "dist/$dir/"
          cp "target/$TARGET/release/m365-webhook" "dist/$dir/"
          cp README.md ARCHITECTURE.md LICENSE .env.example "dist/$dir/"
          cp deploy/docker-compose.yml deploy/Dockerfile deploy/.env.example \
             deploy/README.md deploy/up.sh deploy/down.sh "dist/$dir/realtime/"
          cp "target/$TARGET/release/m365-webhook" "dist/$dir/realtime/"
          chmod +x "dist/$dir/ark" "dist/$dir/realtime/up.sh" \
                   "dist/$dir/realtime/down.sh" "dist/$dir/realtime/m365-webhook"
          tar -C dist -czf "$asset" "$dir"
          sha256sum "$asset" > "$asset.sha256"
      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: assets-linux-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
          - arch: aarch64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        shell: pwsh
        run: cargo build --release --locked --target "${{ matrix.target }}" -p ask-ark
      - name: Package
        shell: pwsh
        run: |
          $dir = "ask-ark-$env:GITHUB_REF_NAME"
          $asset = "ask-ark-${{ matrix.arch }}-windows.zip"
          New-Item -ItemType Directory -Force -Path "dist/$dir" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ark.exe" "dist/$dir/"
          Copy-Item README.md, ARCHITECTURE.md, LICENSE, .env.example "dist/$dir/"
          Compress-Archive -Path "dist/$dir" -DestinationPath $asset
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
          "$hash  $asset" | Set-Content -NoNewline "$asset.sha256"
      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: assets-windows-${{ matrix.arch }}
          path: |
            *.zip
            *.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Collect assets
        uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          merge-multiple: true
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
